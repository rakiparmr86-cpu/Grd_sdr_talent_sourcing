# Postgres + pgvector + Ollama + the API. Run from repo root:
#   docker compose -f deploy/docker-compose.yml up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: grd
      POSTGRES_PASSWORD: grd
      POSTGRES_DB: grd
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grd"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: ["ollama:/root/.ollama"]

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      GRD_DATABASE_URL: postgresql+psycopg://grd:grd@db:5432/grd
      GRD_LLM_PROVIDER: ollama
      GRD_OLLAMA_BASE_URL: http://ollama:11434
      GRD_AGENT: ai_sdr
      GRD_ENRICHMENT_PROVIDERS: mock,web
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports: ["8000:8000"]

volumes:
  pgdata: {}
  ollama: {}
